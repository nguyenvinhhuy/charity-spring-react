# ============================================================
# Social login (Google + Facebook) — active only with profile "oauth".
# Enable by setting SPRING_PROFILES_ACTIVE=oauth and providing the client credentials.
# ============================================================
spring:
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid,profile,email
          facebook:
            client-id: ${FACEBOOK_CLIENT_ID}
            client-secret: ${FACEBOOK_CLIENT_SECRET}
            scope: email,public_profile
        provider:
          # Ask Facebook's Graph API for the fields we persist (default omits picture).
          facebook:
            user-info-uri: https://graph.facebook.com/me?fields=id,name,email,picture
