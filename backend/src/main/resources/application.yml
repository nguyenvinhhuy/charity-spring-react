spring:
  application:
    name: clb-charity
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/clb_charity}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 20MB
  mvc:
    problemdetails:
      enabled: true
  # Social login (Google/Facebook) is configured in application-oauth.yml and only
  # loads when the "oauth" profile is active (set SPRING_PROFILES_ACTIVE=oauth), so the
  # app starts cleanly without provider credentials.

server:
  port: 8080
  error:
    include-message: always
  # Build OAuth2 redirect URIs from X-Forwarded-* headers so the flow works
  # behind the Vite dev proxy (same-origin) and any reverse proxy in prod.
  forward-headers-strategy: framework

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiry: 900       # 15 minutes in seconds
    refresh-token-expiry: 604800   # 7 days in seconds
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    # Base URL returned to clients for stored objects. In Docker the backend
    # reaches MinIO at http://minio:9000, but browsers must use localhost.
    public-endpoint: ${MINIO_PUBLIC_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: clb-media
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  bank:
    account-no: ${BANK_ACCOUNT_NO:1234567890}
    account-name: ${BANK_ACCOUNT_NAME:CLB Thien Nguyen}
  oauth2:
    # Frontend URLs the backend redirects the browser to after social login.
    success-redirect: ${OAUTH2_SUCCESS_REDIRECT:http://localhost:5173/auth/callback}
    failure-redirect: ${OAUTH2_FAILURE_REDIRECT:http://localhost:5173/auth/sign-in?error=oauth}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.springframework.security: INFO
