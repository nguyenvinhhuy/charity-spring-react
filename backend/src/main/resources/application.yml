spring:
  application:
    name: clb-charity
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/clb_charity}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 20MB
  mvc:
    problemdetails:
      enabled: true
  data:
    web:
      pageable:
        max-page-size: 100
        default-page-size: 20
  # Social login (Google/Facebook) is configured in application-oauth.yml and only
  # loads when the "oauth" profile is active (set SPRING_PROFILES_ACTIVE=oauth), so the
  # app starts cleanly without provider credentials.

server:
  port: 8080
  error:
    include-message: always
  # Build OAuth2 redirect URIs from X-Forwarded-* headers so the flow works
  # behind the Vite dev proxy (same-origin) and any reverse proxy in prod.
  forward-headers-strategy: framework

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiry: 900       # 15 minutes in seconds
    refresh-token-expiry: 604800   # 7 days in seconds
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME}
    api-key: ${CLOUDINARY_API_KEY}
    api-secret: ${CLOUDINARY_API_SECRET}
    upload-folder: ${CLOUDINARY_UPLOAD_FOLDER:clb-media}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  oauth2:
    # Frontend URLs the backend redirects the browser to after social login.
    success-redirect: ${OAUTH2_SUCCESS_REDIRECT:http://localhost:5173/auth/callback}
    failure-redirect: ${OAUTH2_FAILURE_REDIRECT:http://localhost:5173/auth/sign-in?error=oauth}
  render:
    api-key: ${RENDER_API_KEY:}
    service-id: ${RENDER_SERVICE_ID:}
  alert:
    resend-api-key: ${RESEND_API_KEY:}
    email-to: ${ALERT_EMAIL_TO:nguyenvana0258@gmail.com}
    email-from: ${ALERT_EMAIL_FROM:onboarding@resend.dev}
    threshold-fraction: 0.8
    database-limit-bytes: ${DB_STORAGE_LIMIT_BYTES:524288000}       # 500 MB (Supabase free tier)
    cloudinary-limit-bytes: ${CLOUDINARY_STORAGE_LIMIT_BYTES:26843545600}  # 25 GB (Cloudinary free tier)

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.springframework.security: INFO
