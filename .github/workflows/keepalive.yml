name: Keep backend awake

# Render's free tier sleeps a web service after ~15 minutes with no traffic. This pings
# the health endpoint every 14 minutes so it never gets the chance to sleep.
#
# NOTE: GitHub disables scheduled workflows automatically after 60 days with no repo
# activity, and cron timing is best-effort (can be delayed under GitHub Actions load).
# See setup.md for a more reliable external alternative (UptimeRobot / cron-job.org).

on:
  schedule:
    - cron: "*/14 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          if [ -z "${{ secrets.BACKEND_HEALTH_URL }}" ]; then
            echo "BACKEND_HEALTH_URL secret is not set — see setup.md."
            exit 1
          fi
          curl -fsS "${{ secrets.BACKEND_HEALTH_URL }}"
