services:
  postgres:
    image: postgres:16-alpine
    container_name: clb_postgres
    environment:
      POSTGRES_DB: clb_charity
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d clb_charity"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: clb_backend
    environment:
      # Point at the compose service names, not localhost.
      DB_URL: jdbc:postgresql://postgres:5432/clb_charity
      DB_USER: postgres
      DB_PASSWORD: postgres
      # Free Cloudinary account — fill these in your shell env or a local .env file,
      # never commit real values here.
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      CORS_ORIGINS: http://localhost:5173
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: clb_frontend
    environment:
      # Vite dev server proxies /api to the backend container; polling makes
      # HMR work over the bind mount on Windows/macOS.
      VITE_PROXY_TARGET: http://backend:8080
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
